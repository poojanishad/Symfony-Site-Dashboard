framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false          # deprecated true in 7.x; use false in 7.4
    handle_all_throwables: true
    ide: '%env(default::SYMFONY_IDE)%'

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    # 7.4: New lock component defaults
    lock: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
