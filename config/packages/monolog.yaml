monolog:
    channels:
        - dashboard     # dedicated channel for all dashboard operations
        - domain        # domain events: SiteRecordCreated, SiteRecordUpdated, etc.
        - application   # command/query handler lifecycle (LoggingMiddleware)
        - performance   # slow-handler alerts and Stopwatch measurements

    handlers:

        # ── Main application log ──────────────────────────────────────────────
        # fingers_crossed buffers until ERROR, then flushes the last 50 lines.
        # All 4 custom channels are excluded so nothing leaks here.
        main:
            type:         fingers_crossed
            action_level: error
            handler:      nested
            excluded_http_codes: [404, 405]
            buffer_size:  50
            channels:     ['!event', '!dashboard', '!domain', '!application', '!performance']

        nested:
            type:      rotating_file
            path:      '%kernel.logs_dir%/%kernel.environment%.log'
            level:     debug
            max_files: 14

        # ── Dashboard dedicated log ───────────────────────────────────────────
        dashboard_log:
            type:      rotating_file
            path:      '%kernel.logs_dir%/dashboard.log'
            level:     debug
            max_files: 30
            channels:  [dashboard]
            formatter: monolog.formatter.json

        # ── Performance log ───────────────────────────────────────────────────
        # Uses dedicated `performance` channel (not dashboard message-content filter).
        # Inject via: #[Target('performance')] LoggerInterface $logger
        performance_log:
            type:      rotating_file
            path:      '%kernel.logs_dir%/dashboard_performance.log'
            level:     debug
            max_files: 30
            channels:  [performance]
            formatter: monolog.formatter.json

        # ── Domain events audit log ───────────────────────────────────────────
        domain_log:
            type:      rotating_file
            path:      '%kernel.logs_dir%/domain.log'
            level:     info
            max_files: 90
            channels:  [domain]
            formatter: monolog.formatter.json

        # ── Application command/query log ─────────────────────────────────────
        application_log:
            type:      rotating_file
            path:      '%kernel.logs_dir%/application.log'
            level:     debug
            max_files: 14
            channels:  [application]
            formatter: monolog.formatter.json

        # ── Console output (dev only) ─────────────────────────────────────────
        console:
            type:     console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console']


when@test:
    monolog:
        handlers:
            main:
                type:         fingers_crossed
                action_level: error
                handler:      nested
            nested:
                type:  stream
                path:  '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
            dashboard_log:
                type:     stream
                path:     '%kernel.logs_dir%/test_dashboard.log'
                level:    debug
                channels: [dashboard]
            performance_log:
                type:     stream
                path:     '%kernel.logs_dir%/test_performance.log'
                level:    debug
                channels: [performance]
            domain_log:
                type:     stream
                path:     '%kernel.logs_dir%/test_domain.log'
                level:    debug
                channels: [domain]
            application_log:
                type:     stream
                path:     '%kernel.logs_dir%/test_application.log'
                level:    debug
                channels: [application]


when@prod:
    monolog:
        handlers:
            application_log:
                type:      rotating_file
                path:      '%kernel.logs_dir%/application.log'
                level:     warning
                max_files: 14
                channels:  [application]
                formatter: monolog.formatter.json
            stderr_json:
                type:      stream
                path:      php://stderr
                level:     info
                channels:  [domain, application, performance, dashboard]
                formatter: monolog.formatter.json
